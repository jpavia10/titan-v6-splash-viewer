<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Titan Reliquary — Obsidian intro · v8 overnight attempt (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
video{height:100%;width:100%;object-fit:cover;background:#000}
@media (orientation:landscape){video{object-fit:contain}}
#title{position:fixed;left:0;right:0;bottom:calc(11vh + env(safe-area-inset-bottom));text-align:center;color:#efe6da;font:600 clamp(30px,9.5vw,64px)/1.08 Fraunces,Georgia,serif;letter-spacing:.3em;padding-left:.3em;opacity:0;pointer-events:none;text-shadow:0 2px 24px rgba(0,0,0,.85),0 0 40px rgba(255,190,130,.18);will-change:opacity,transform,letter-spacing}
@media (orientation:landscape){#title{bottom:7vh;font-size:clamp(22px,4.4vw,52px)}#title br{display:none}}
#ui{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;z-index:3}
#ui button,#start{background:rgba(0,0,0,.4);border:1px solid #3a3632;color:#b3aa9f;font-size:11px;padding:7px 11px;border-radius:14px;backdrop-filter:blur(6px)}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;padding:13px 24px;letter-spacing:.22em;z-index:4}
#tag{position:fixed;left:12px;bottom:calc(10px + env(safe-area-inset-bottom));color:#6f6a64;font-size:10px;letter-spacing:.08em;z-index:3}#tag a{color:inherit}
#poster{position:fixed;inset:0;background:#000 center/cover no-repeat;z-index:1;transition:opacity .6s}
</style></head><body>
<div id="stage"><video id="v" playsinline preload="auto" src="obsidian-intro-v8.mp4"></video></div>
<div id="poster" style="background-image:url(poster-title-portrait.jpg)"></div>
<div id="title">TITAN<br>RELIQUARY</div>
<div id="ui"><button id="mute">sound on</button><button id="skip">skip</button><button id="replay" style="display:none">replay</button></div>
<button id="start">▶ PLAY INTRO</button>
<div id="tag">v8 overnight attempt (preview, not gold) · <a href="../">hub</a></div>
<script>
const v=document.getElementById('v'),T=document.getElementById('title'),P=document.getElementById('poster'),S=document.getElementById('start'),
 mute=document.getElementById('mute'),skip=document.getElementById('skip'),rep=document.getElementById('replay');
const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const TIN=10.15;
function tick(){const t=v.currentTime;const k=ss(TIN,TIN+1.3,t);T.style.opacity=k;T.style.transform=`translateY(${(1-k)*16}px)`;T.style.letterSpacing=(0.48-0.18*ss(TIN,TIN+2.2,t))+'em';T.style.filter=`blur(${(1-ss(TIN,TIN+.9,t))*6}px)`;requestAnimationFrame(tick)}
function play(){v.currentTime=0;v.muted=mute.textContent==='sound off';v.play();P.style.opacity=0;S.style.display='none';rep.style.display='none';skip.style.display=''}
S.onclick=play;rep.onclick=play;
skip.onclick=()=>{if(v.currentTime<TIN-.2)v.currentTime=TIN-.2};
mute.onclick=()=>{v.muted=!v.muted;mute.textContent=v.muted?'sound off':'sound on'};
v.onended=()=>{rep.style.display='';skip.style.display='none'};
const q=new URLSearchParams(location.search);if(q.has('t')){P.style.display='none';S.style.display='none';v.muted=true;const sk=()=>{v.currentTime=+q.get('t')};v.readyState>=1?sk():v.addEventListener('loadedmetadata',sk,{once:true});}
tick();
</script></body></html>
